
services:
    mailpit:
        image: axllent/mailpit:v1.23
        environment:
            - REMOTE_URL=http://web:80
        networks:
            - backend
        ports:
            - "8025:8025"
        depends_on:
            - web

    app:
        environment:
            # 4.6:
            - MAILER_URL=smtp://mailpit:1025
            # 5.x:
            - MAILER_DSN=smtp://mailpit:1025
